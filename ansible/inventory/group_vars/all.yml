---
# ==========================================================
# NexGenAds Home Server — central variables
# ==========================================================
# These values are used by every role. Change them here and the
# whole stack follows. Do NOT duplicate them inside roles.

# --- Connection / inventory ----------------------------------
# The SSH host and user are declared in inventory/hosts.ini.
ansible_become: true

# SSH reaches the origin server through Cloudflare Access.
# This mirrors the ProxyCommand that setup.sh writes into ~/.ssh/config.
ansible_ssh_common_args: >-
  -o ProxyCommand="cloudflared access ssh --hostname %h"

# --- Server identity ------------------------------------------
server_hostname: server.nexgenads.space
server_user: home

# --- Common role ----------------------------------------------
common_packages:
  - curl
  - wget
  - gnupg
  - ca-certificates
  - apt-transport-https
  - software-properties-common
  - python3-apt

# --- Nginx reverse proxy --------------------------------------
nginx_service: nginx
nginx_port: 80
application_port: 8090

# --- Jenkins ---------------------------------------------------
jenkins_service: jenkins
jenkins_port: 8080
jenkins_subpath: /jenkins/
jenkins_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
jenkins_keyring: /usr/share/keyrings/jenkins-keyring.asc
jenkins_apt_repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
jenkins_java_package: openjdk-17-jre-headless

# --- Grafana ---------------------------------------------------
grafana_service: grafana-server
grafana_port: 3000
grafana_bind_address: 127.0.0.1
grafana_subpath: /grafana/
grafana_domain: "{{ server_hostname }}"
grafana_root_url: "https://{{ server_hostname }}{{ grafana_subpath }}"
grafana_serve_from_sub_path: true
grafana_key_url: https://apt.grafana.com/gpg.key
grafana_keyring: /usr/share/keyrings/grafana.gpg
grafana_apt_repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
grafana_provisioning_dir: /etc/grafana/provisioning
grafana_datasources_dir: "{{ grafana_provisioning_dir }}/datasources"
grafana_dashboards_dir: "{{ grafana_provisioning_dir }}/dashboards"
grafana_prometheus_url: "http://127.0.0.1:{{ prometheus_port }}"
grafana_prometheus_datasource_name: Prometheus
grafana_prometheus_datasource_uid: prometheus
grafana_prometheus_datasource_default: true
grafana_server_metrics_dashboard_uid: nexgenads-server-metrics

# --- Node Exporter ----------------------------------------------
node_exporter_service: node-exporter
node_exporter_version: 1.12.1
node_exporter_arch: amd64
node_exporter_bind_address: 127.0.0.1
node_exporter_port: 9100
node_exporter_install_dir: /opt/node_exporter
node_exporter_binary: /opt/node_exporter/node_exporter
node_exporter_archive_path: >-
  /tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
node_exporter_release_base: https://github.com/prometheus/node_exporter/releases/download
node_exporter_download_url: >-
  {{ node_exporter_release_base }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
node_exporter_checksum: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"

# --- Prometheus ------------------------------------------------
prometheus_service: prometheus
prometheus_version: 3.13.2
prometheus_arch: amd64
prometheus_bind_address: 127.0.0.1
prometheus_port: 9090
prometheus_config_dir: /etc/prometheus
prometheus_data_dir: /var/lib/prometheus
prometheus_install_dir: /opt/prometheus
prometheus_binary: /opt/prometheus/prometheus
prometheus_promtool: /opt/prometheus/promtool
prometheus_archive_path: >-
  /tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz
prometheus_release_base: https://github.com/prometheus/prometheus/releases/download
prometheus_download_url: >-
  {{ prometheus_release_base }}/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz
prometheus_checksum: "sha256:0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f"
