; NexGenAds Home Server inventory
;
; Usage:
;   ansible-playbook -i inventory/hosts.ini playbooks/server.yml
;
; The SSH host and user are declared here so Ansible knows the
; real endpoint. Group-wide configuration lives in
; inventory/group_vars/all.yml.

[home_server]
home ansible_host=server.nexgenads.space ansible_user=home
