[defaults]

# Inventory file used when none is passed with -i
inventory = inventory/hosts.ini

# Look for roles in ./roles (run ansible from this directory)
roles_path = ./roles

# Keep host key verification enabled (do not weaken SSH security)
host_key_checking = True

# Let Ansible pick the right Python interpreter on the target
interpreter_python = auto_silent

# Do not leave retry files around
retry_files_enabled = False

timeout = 30
forks = 5

[ssh_connection]

# SSH reaches the server through Cloudflare Access (cloudflared).
# Connection must stay alive for apt/systemd operations.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ConnectTimeout=30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
