---
# ==========================================================
# common — basic server preparation
# ==========================================================
# Updates the APT cache and installs the base packages that the
# other roles depend on. No application-specific setup happens
# here.

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
