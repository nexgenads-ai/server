---
# Defaults for the node_exporter role.
# Values are centralized in inventory/group_vars/all.yml.
# These defaults are used only when the group_vars value is
# not defined.

node_exporter_service: node-exporter
node_exporter_version: 1.12.1
node_exporter_arch: amd64
node_exporter_bind_address: 127.0.0.1
node_exporter_port: 9100
node_exporter_install_dir: /opt/node_exporter
node_exporter_binary: /opt/node_exporter/node_exporter
node_exporter_archive_path: >-
  /tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
node_exporter_release_base: https://github.com/prometheus/node_exporter/releases/download
node_exporter_download_url: >-
  {{ node_exporter_release_base }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
node_exporter_checksum: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
