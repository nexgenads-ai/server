---
# ==========================================================
# grafana — native systemd installation (converge, not rebuild)
# ==========================================================
# Grafana is already installed as a native systemd service.
# This role converges the machine and manages ONLY the
# /etc/grafana/grafana.ini [server] settings required for the
# /grafana/ subpath deployment.
#
# The original grafana.ini is preserved in a timestamped backup
# (created by the template module only when the file changes).
# Grafana data under /var/lib/grafana is never touched.

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Check whether grafana is already installed
  ansible.builtin.set_fact:
    grafana_present: "{{ 'grafana' in ansible_facts.packages }}"

# --- Install only when grafana is missing ----------------------
- name: Add official Grafana repository signing key
  ansible.builtin.apt_key:
    url: "{{ grafana_key_url }}"
    keyring: "{{ grafana_keyring }}"
    state: present
  when: not grafana_present

- name: Add official Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "{{ grafana_apt_repo }}"
    filename: grafana
    state: present
    update_cache: true
  when: not grafana_present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
  when: not grafana_present

# --- Configuration (idempotent template + backup) -------------
# Grafana must stay behind Nginx and Cloudflare. The required
# subpath settings are:
#   root_url        = https://server.nexgenads.space/grafana/
#   serve_from_sub_path = true
# These are rendered from group_vars/all.yml.

- name: Deploy grafana.ini from template
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: grafana
    group: grafana
    mode: "0640"
    backup: true
  notify: Restart grafana-server

# --- Converge the service (safe every run) ----------------------
- name: Enable and start grafana-server service
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

- name: Apply any pending configuration changes before verification
  ansible.builtin.meta: flush_handlers

# --- Verification ------------------------------------------------
- name: Wait for Grafana to listen on port {{ grafana_port }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ grafana_port }}"
    state: started
    timeout: 120
  check_mode: false

- name: Check grafana-server service status
  ansible.builtin.command: systemctl is-active grafana-server
  register: grafana_active
  changed_when: false
  check_mode: false

- name: Assert grafana-server is active
  ansible.builtin.assert:
    that:
      - grafana_active.stdout == "active"
    success_msg: "grafana-server.service is active"
    fail_msg: "grafana-server.service is not active"

- name: Check grafana is listening on port {{ grafana_port }}
  ansible.builtin.shell: "ss -lntp | grep :{{ grafana_port }}"
  register: grafana_port_check
  changed_when: false
  check_mode: false

- name: Assert grafana port is bound
  ansible.builtin.assert:
    that:
      - grafana_port_check.rc == 0
    success_msg: "Grafana is listening on port {{ grafana_port }}"
    fail_msg: "Grafana is NOT listening on port {{ grafana_port }}"

- name: Check Grafana responds locally
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/"
    status_code:
      - 200
      - 302
  register: grafana_http
  check_mode: false

- name: Assert Grafana responds on port {{ grafana_port }}
  ansible.builtin.assert:
    that:
      - grafana_http.status in [200, 302]
    success_msg: "Grafana responds on port {{ grafana_port }}"
    fail_msg: "Grafana did not respond on port {{ grafana_port }}"
