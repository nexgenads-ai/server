---
# ==========================================================
# Configure NexGenAds Home Server
# ==========================================================
# Converges the origin server: Ubuntu + Nginx + Jenkins + Grafana
# + Prometheus + Node Exporter.
#
# Role order matters:
#   common        -> base packages
#   jenkins       -> backend service
#   node_exporter -> monitored agent (scraped by Prometheus)
#   prometheus    -> monitoring backend (scrapes node_exporter,
#                    queried by Grafana)
#   grafana       -> frontend (reads Prometheus over loopback)
#   nginx         -> reverse proxy (last layer, routes to backends)
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini playbooks/server.yml
#
# Check mode (dry run):
#   ansible-playbook -i inventory/hosts.ini playbooks/server.yml --check

- name: Configure NexGenAds Home Server
  hosts: home_server
  become: true

  roles:
    - common
    - jenkins
    - node_exporter
    - prometheus
    - grafana
    - nginx
